server:
  port: 8080

spring:
  application:
    name: photo-album
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/photo_album?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: YourSecretKeyForJWTTokenGenerationMustBeVeryLongAndSecure123456789
  expiration: 86400000

file:
  upload:
    path: ./uploads
    allowed-types: jpg,jpeg,png,gif,bmp,webp
    max-size: 10485760
